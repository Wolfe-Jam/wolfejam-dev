<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A5C"/>
      <stop offset="50%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E55A2B"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
  </defs>
  
  <!-- Orange - original relationship -->
  <circle cx="256" cy="295" r="200" fill="url(#orangeGrad)"/>
  
  <!-- Leaf - y=208 was the goldilocks position -->
  <text x="256" y="208" font-family="Georgia, serif" font-size="380" font-weight="400" fill="url(#leafGrad)" text-anchor="middle">∞</text>
</svg>
